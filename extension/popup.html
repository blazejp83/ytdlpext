<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ytdlext</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="container">
      <div class="header">
        <div class="page-info">
          <div class="page-title" id="page-title">Loading...</div>
          <div class="page-url" id="page-url"></div>
        </div>
        <a class="history-link" id="history-link" title="Download History">History</a>
        <button class="settings-btn" id="settings-btn" title="Settings">
          &#9881;
        </button>
      </div>

      <div class="format-picker" id="format-picker" hidden>
        <div class="tab-bar">
          <button class="tab active" id="tab-video" data-tab="video">Video</button>
          <button class="tab" id="tab-audio" data-tab="audio">Audio</button>
        </div>

        <div class="tab-content" id="tab-content-video">
          <div class="format-list" id="format-list">
            <label class="format-row selected">
              <input type="radio" name="video-format" value="" checked />
              <span class="format-label">Best Quality</span>
              <span class="format-detail">Auto-select best video + audio</span>
            </label>
          </div>
          <button class="download-btn" id="video-download-btn">Download</button>
        </div>

        <div class="tab-content" id="tab-content-audio" hidden>
          <div class="audio-format-chips">
            <button class="chip selected" data-format="mp3">MP3</button>
            <button class="chip" data-format="flac">FLAC</button>
            <button class="chip" data-format="wav">WAV</button>
            <button class="chip" data-format="ogg">Ogg</button>
          </div>
          <div class="audio-options">
            <label class="checkbox-row">
              <input type="checkbox" id="embed-metadata" checked />
              <span>Include metadata</span>
            </label>
            <label class="checkbox-row">
              <input type="checkbox" id="embed-thumbnail" checked />
              <span>Include cover art</span>
            </label>
          </div>
          <button class="download-btn" id="audio-download-btn">Download</button>
        </div>

        <div class="options-section">
          <div id="youtube-options" hidden>
            <label class="checkbox-row"><input type="checkbox" id="sponsorblock" /><span>Remove sponsor segments</span></label>
            <div class="subtitle-row">
              <label>Subtitles:</label>
              <select id="subtitle-lang"><option value="">None</option></select>
              <label class="checkbox-row"><input type="checkbox" id="embed-subs" checked /><span>Embed</span></label>
            </div>
          </div>
          <label class="checkbox-row"><input type="checkbox" id="use-cookies" /><span>Use browser cookies (age-restricted content)</span></label>
        </div>
      </div>

      <div class="loading-section" id="loading-section" hidden>
        <div class="spinner"></div>
        <div class="loading-text">Loading formats...</div>
      </div>

      <div class="action" id="action-section" hidden>
        <button class="download-btn" id="download-btn">
          Download Best Quality
        </button>
      </div>

      <div class="progress-section" id="progress-section" hidden>
        <div class="progress-filename" id="progress-filename"></div>
        <div class="progress-bar">
          <div class="progress-fill" id="progress-fill"></div>
        </div>
        <div class="progress-stats">
          <span class="progress-pct" id="progress-pct">0%</span>
          <span class="progress-speed" id="progress-speed"></span>
          <span class="progress-eta" id="progress-eta"></span>
        </div>
        <button class="cancel-btn" id="cancel-btn">Cancel Download</button>
      </div>

      <div class="complete-section" id="complete-section" hidden>
        <div class="complete-icon">&#10003;</div>
        <div class="complete-text">Download complete!</div>
        <div class="complete-filename" id="complete-filename"></div>
        <button class="download-btn" id="download-another-btn">
          Download Another
        </button>
      </div>

      <div class="error-section" id="error-section" hidden>
        <div class="error-text" id="error-text"></div>
        <button class="download-btn retry-btn" id="retry-btn">Retry</button>
      </div>

      <div class="unsupported" id="unsupported-section" hidden>
        <div class="unsupported-text">Not a supported site</div>
      </div>

      <div id="history-section" hidden>
        <a class="history-back" id="history-back">&larr; Back</a>
        <div class="history-list" id="history-list"></div>
        <button class="history-clear-btn" id="history-clear">Clear History</button>
      </div>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
